<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#a5b4c6"/></marker></defs><rect width="1000" height="400" rx="14" fill="#10141d"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#edf2f7"><text x="45" y="48" font-size="25">压缩的是模型要读的历史，Todo 是独立状态</text>
<rect x="50" y="85" width="390" height="100" rx="8" fill="#172d43" stroke="#6cb8ff"/><text x="77" y="123" font-size="23" fill="#6cb8ff">旧消息：资料、工具返回、讨论</text><text x="77" y="160" font-size="18">目标和关键证据需要被提取</text>
<path d="M455 135 H550" stroke="#a5b4c6" stroke-width="3" marker-end="url(#arrow)"/><rect x="570" y="85" width="375" height="100" rx="8" fill="#17382c" stroke="#64d8a2"/><text x="595" y="124" fill="#64d8a2" font-size="23">摘要 + 近期原始消息</text><text x="595" y="162" font-size="18">形成较短的有效模型输入</text>
<rect x="50" y="220" width="895" height="75" rx="8" fill="#30283d" stroke="#b49bff"/><text x="77" y="266" fill="#c5afff" font-size="23">todos：已完成 / 进行中 / 待办　→　压缩前后保留</text>
<text x="60" y="342" font-size="20">本轮原始 State 消息继续增长；模型有效上下文被压缩。</text><text x="60" y="377" fill="#9daabb" font-size="17">字段保留不等于自动呈现在提示词中；还需检查模型收到什么。</text></g></svg>