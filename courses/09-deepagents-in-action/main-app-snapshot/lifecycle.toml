version = 2
template = "deepagents/default"
name = "My DeepAgent"
description = "Backend-only DeepAgents starter exposed through an AG-UI gateway."
env_file = ".env"
guide = "README.md"

[tools]
required = ["uv"]

[paths]
required = ["pyproject.toml", "src/my_deepagent/demo_binding.py"]

[env.BUB_MODEL]
required = true
description = "Model id used by the DeepAgents binding."
aliases = ["AGENTSEEK_MODEL", "DEEPAGENTS_MODEL"]

[env.BUB_API_KEY]
required = true
description = "Provider API key used by the selected model."
aliases = ["AGENTSEEK_API_KEY", "OPENAI_API_KEY"]

[env.BUB_API_BASE]
required = false
description = "Optional OpenAI-compatible provider base URL."
aliases = ["AGENTSEEK_API_BASE", "OPENAI_API_BASE", "OPENAI_BASE_URL"]

[env.BUB_LANGCHAIN_SPEC]
required = true
description = "Import path for the AgentSeek LangChain RunnableSpec."
aliases = ["AGENTSEEK_LANGCHAIN_SPEC"]

[env.BUB_AG_UI_PORT]
required = true
description = "AG-UI gateway port."
aliases = ["AGENTSEEK_AG_UI_PORT"]

[services.gateway]
name = "AG-UI gateway"
url = "http://127.0.0.1:18088/agent"
kind = "protocol"
display = "default"
primary = true
description = "AG-UI protocol endpoint for this backend-only DeepAgents template."
tech = "ag-ui"
links = { docs = "https://docs.ag-ui.com/introduction" }

[processes.gateway]
command = ["uv", "run", "bub", "gateway", "--enable-channel", "ag-ui"]

[checks.gateway]
type = "http"
target = "http://127.0.0.1:18088/agent/health"
timeout = 2.0
attempts = 3

[tasks.sync]
description = "Install Python dependencies."

command = ["uv", "sync", "--frozen"]

